<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
    body{
    margin: 0px;
    width: 100%;
}

.containerNext{
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.buttonAnswers{
    border: none;
    padding: 10px;
    margin: 5px;
    border-radius: 4px;
}
.buttonAnswers:hover{
    background: #FC9797;
}

.buttonNext{
    border-radius: 4px;
    background: #D33D44;
    width: 200px;
    height: 40px;
    font-size: medium;
    font-style: normal;
    color: white;
    border: none;
}

.buttonNext:active{
    background: #60393b;
}

.question{
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: auto;
    max-width:90%;
    display: flex;
    overflow-y:auto;
}
.title{
    padding-top: 1rem;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
}

.answers{
    padding-top: 1rem;
    padding-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    display: flex;
    flex-wrap: wrap;
}

.titleMain{
    color: #000000;
    font-size: 1.7rem;
}
.titleSub{
    color: #020202;
    font-size: 1rem;

}
.quizSection{
    border-radius: 15px;
    background: #FFF;
    width: 60%;
    min-height: 300px;
    height: auto;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
    text-align: center;
    margin: auto;


}
.reTry{
    border-radius: 4px;
    background: #D33D44;
    width: 200px;
    height: 40px;
    font-size: medium;
    font-style: normal;
    color: white;
    border: none;
}
.recSection{
    background: #D33D44;
    margin-top: 50px;
    display: flex;
    overflow-y:auto;
}
.post{

    border-radius: 4px;
    background: #ffffff;
    margin: 5px;
    width: 22%;
    height: 70%;
}

.postText{
    padding-top: 1rem;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;

}
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modalContent {
    background: white;
    padding: 20px;
    max-width: 600px;
    height: auto;
    max-height: 100%;
    overflow-y: auto;
    border-radius: 8px;
    position: relative;
}

.closeBtn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 24px;
    cursor: pointer;
}
.buttonBook{
    border-radius: 4px;
    background: #D33D44;
    width: 200px;
    height: 40px;
    font-size: medium;
    font-style: normal;
    color: white;
    border: none;
}
.buttonBook:hover{
    background: #FC9797;
}
</style>
<div class="quizSection">

    <h1 class="title titleMain" >...og ind det du søger</h1>

    <h2 class="title titleSub" >SÅ PRØV VORES QUIZ GUIDE:</h2>


    <div class="container" id="quizContainer">
        <p class="question" id="question"></p>
        <div class="answers" id="answers"></div>
        <div class="containerNext">  
            <button class="buttonNext" onclick="nextQuestion()">Næste Spørgsmål</button>
        </div>
    </div>
    <div id="result" style="display:none;">
        <h2 class="title" >Din familietype er:<span id="personality">   </span></h2>
    </div>
    <div class="containerNext">
        <button class="reTry" id="reTry" style="display: none;" onclick="showQuestion(), reset()">Prøv Igen</button>
    </div>
</div>

<div id="recSection" class="quizSection recSection">

</div>

<div id="popupModal" class="modal" style="display: none;">
    <div class="modalContent">
        <span class="closeBtn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <div id="modalContent"></div>
        <button class="buttonBook">Book Now</button>
    </div>
</div>

<script>
    
var familyStats = [
    0,      // adventurous
    0,      //creative
    0,      //chill
    0,      //organized
    0,      //sporty
    0,      //geeky
];      

var currentQuestion = 0;

var questionText = [
    "Hvad kan jeres børn bedst lide at lave i deres fritid?",
    "Hvor tit laver I noget sammen som familie?",
    "Er I mest til udendørs eller indendørs aktiviteter?",
    "Er der bestemte interesser eller hobbyer?",
    "Hvilke typer oplevelser nyder I mest som familie?",
    "Er der noget nyt I godt kunne tænke jer at prøve sammen som familie?",
];

var answerText = [
    ["Udforske nye steder",
    "Lege med legetøj",
    "Læse",
    "Rydde op",
    "Løbe/sport",
    "Spille videospil"],

    ["Vi tager ofte på spontane ture",
    "Vi Maler eller tegner",
    "Vi hygger os med film",
    "Vi Planlægger næste uge",
    "Vi Spiller fodbold",
    "Vi laver noget Teknisk"],

    ["Udendørs i naturen",
    "Indendørs",
    "Hjemme er bedst",
    "Begge dele",
    "Sport og være aktiv ",
    "Online"],

    ["Gå på eventyr",
    "Lave kreative projekter",
    "Chille", 
    "Vi har en fælles rutine",
    "Sport og bevægelse",
    "Teknologi og gaming"],

    ["Actionfyldte ture",
    "kreative workshops",
    "Familiehygge",
    "Planlagte aktiviteter",
    "sportsarrangementer",
    "Teknologi"],
    
    ["Camping",
    "Et kreativt projekt",
    "Prøve en spaoplevelse",
    "Et organiseret familieprojekt",
    "sport sammen",
    "Kode eller spille sammen"]
];

var answerValues = [
    [[3,1,0,0,2,0],
    [0,3,1,0,0,2],
    [0,0,3,1,0,2],
    [0,0,2,3,0,1],
    [2,1,0,0,3,0],
    [0,1,2,0,0,3]],

    [[3,1,0,0,2,0],
    [0,3,2,0,0,1],
    [0,0,3,1,0,2],
    [0,0,1,3,0,2],
    [2,1,0,0,3,0],
    [0,1,1,0,0,3]],

    [[2,1,1,0,0,2],
    [1,3,1,0,0,1],
    [0,0,1,3,0,2],
    [0,0,0,3,0,3],
    [2,1,0,0,3,0],
    [0,1,0,0,0,4]],

    [[3,1,0,0,2,0],
    [0,3,1,0,0,2],
    [0,0,3,1,0,2],
    [0,0,1,3,0,2],
    [2,1,0,0,3,0],
    [0,0,1,0,0,4]],

    [[2,1,0,0,3,0],
    [1,3,0,0,0,2],
    [0,0,3,0,0,3],
    [0,0,0,4,0,2],
    [3,0,0,0,3,0],
    [0,0,0,0,0,5]],

    [[3,1,0,0,2,0],
    [0,3,1,0,0,2],
    [0,0,4,0,0,2], 
    [0,0,1,3,0,2], 
    [2,1,0,0,3,0],
    [0,1,1,0,0,4]]
];

let reTry = document.getElementById("reTry")
let quizContainer = document.getElementById("quizContainer")
let result = document.getElementById("result")
let personality = document.getElementById("personality")
let recSection = document.getElementById("recSection")


function showQuestion() {

    document.getElementById("result").style.display = "none";

    let question = questionText[currentQuestion];
    let answers = answerText[currentQuestion];

    document.getElementById("question").innerText = question;

    let answersHTML = "";

    answers.forEach((answer, i) => {
        answersHTML += `<button class="buttonAnswers" onclick="selectAnswer(${i})">${answer}</button>`;
    });

    document.getElementById("answers").innerHTML = answersHTML;
    console.log(question)




}

function selectAnswer(index) {

    let values = answerValues[currentQuestion][index];
    for (let i = 0; i < familyStats.length; i++) {
        familyStats[i] += values[i];

        console.log(index)

    }

    document.querySelectorAll("#answers button").forEach(btn => btn.disabled = true);
}

function nextQuestion() {

    if (currentQuestion < questionText.length - 1) {
        currentQuestion++;
        showQuestion();
    } else {

        showResult();
    }

    console.log(familyStats)
}

showQuestion(); // Start quizzen

let types = ["Eventyrlysten", 
            "Kreativ", 
            "Chill", 
            "Organiseret", 
            "Sporty", 
            "Nørdet"];

let maxIndex;
let dominantType = "";

function showResult() {
    maxIndex = familyStats.indexOf(Math.max(...familyStats));
    dominantType = types[maxIndex];

    quizContainer.style.display = "none";
    result.style.display = "block";
    personality.innerText = dominantType;

    reTry.style.display = "block";
    console.log(dominantType);

    fetchData(dominantType); // Send tag-navn til fetch
}

function reset() {
    if (currentQuestion > 0){

        currentQuestion = 0;

        familyStats = [
            0,
            0,
            0,
            0,
            0,
            0];
    }

    recSection.innerHTML = '';

    reTry.style.display = "none";
    quizContainer.style.display = "block";

    console.log(familyStats);
}

async function fetchData(tagName) {
    try {
        // 1. Hent alle tags for at finde ID på det ønskede tagnavn
        const tagResponse = await fetch(`https://kristian-frederichsen.dk/wp-json/wp/v2/tags`);
        const tagData = await tagResponse.json();

        const tagObj = tagData.find(tag => tag.name.toLowerCase() === tagName.toLowerCase());

        if (!tagObj) {
            console.log(`Ingen tag fundet for: ${tagName}`);
            return;
        }

        // 2. Brug tag-ID til at hente filtrerede posts
        const postsResponse = await fetch(`https://kristian-frederichsen.dk/wp-json/wp/v2/posts?tags=${tagObj.id}`);
        const posts = await postsResponse.json();

        // 3. Loop og vis resultater
        for (const post of posts) {
            
            console.log(`Titel: ${post.title.rendered}`);
            console.log(`Indhold: ${post.excerpt.rendered}`);

            recSection.innerHTML +=`

            <div class="post" onclick="openModal(${post.id})">
                <div class="title">${post.title.rendered}</div>
                <div class="postText">${post.excerpt.rendered}</div>
            </div>
            `

            
        }

    } catch (error) {
        console.error("Fejl ved hentning af data:", error);
    }
}

async function openModal(postId) {
    try {
        const res = await fetch(`https://kristian-frederichsen.dk/wp-json/wp/v2/posts/${postId}`);
        const post = await res.json();

        document.getElementById("modalTitle").innerHTML = post.title.rendered;
        document.getElementById("modalContent").innerHTML = post.content.rendered;

        document.getElementById("popupModal").style.display = "flex";
    } catch (error) {
        console.error("Fejl ved hentning af post:", error);
    }
}

function closeModal() {
    document.getElementById("popupModal").style.display = "none";
}
showQuestion(); // Start quizzen

</script>
</body>
</html>
